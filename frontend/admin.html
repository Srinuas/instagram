<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Location Logs</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 20px;
            background: #f4f4f9;
            margin: 0;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .admin-header h2 {
            margin: 0;
            font-size: 20px;
            color: #222;
        }
        .close-btn {
            background: #ff3040;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #222;
            color: white;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h2>Recorded Locations</h2>
        <button class="close-btn" onclick="window.location.href='/'">✕ Close</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="log-table"></tbody>
    </table>

    <script>
        fetch('/api/get_locations')
            .then(async res => {
                if (res.status === 401) {
                    window.location.href = '/';
                    throw new Error("Unauthorized");
                }
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || "Database error");
                }
                return data;
            })
            .then(data => {
                const tbody = document.getElementById('log-table');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No locations recorded yet.</td></tr>';
                    return;
                }
                data.forEach(row => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${row.id}</td>
                            <td>${row.latitude}</td>
                            <td>${row.longitude}</td>
                            <td>${row.timestamp}</td>
                        </tr>
                    `;
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('log-table').innerHTML = `<tr><td colspan="4" style="color:red;">Error: ${err.message}</td></tr>`;
            });
    </script>
</body>
</html>
