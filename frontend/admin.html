<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Location Logs</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 20px;
            background: #f4f4f9;
            margin: 0;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .admin-header h2 {
            margin: 0;
            font-size: 22px;
            color: #222;
        }
        .close-btn {
            background: #ff3040;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #1f1f1f;
            color: white;
        }
        .map-btn {
            background: #0095f6;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .map-btn:hover {
            background: #0077cc;
        }

        /* Embedded Map Viewer Modal */
        .map-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .map-modal {
            background: white;
            width: 100%;
            max-width: 720px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
        }
        .map-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: #1f1f1f;
            color: white;
        }
        .map-modal-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .map-modal-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .gmaps-link {
            background: #28a745;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .modal-close {
            background: #ff3040;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .map-iframe {
            width: 100%;
            height: 420px;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h2>Recorded Locations</h2>
        <button class="close-btn" onclick="window.location.href='/'">✕ Close</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Last Seen Timestamp</th>
                    <th>Location Viewer</th>
                </tr>
            </thead>
            <tbody id="log-table"></tbody>
        </table>
    </div>

    <!-- In-App Map Viewer Modal -->
    <div id="map-backdrop" class="map-modal-backdrop" onclick="closeMapViewer()">
        <div class="map-modal" onclick="event.stopPropagation()">
            <div class="map-modal-header">
                <h3 id="map-title">Location Viewer</h3>
                <div class="map-modal-actions">
                    <a id="gmaps-external" class="gmaps-link" href="#" target="_blank" rel="noopener">Open in Google Maps ↗</a>
                    <button class="modal-close" onclick="closeMapViewer()">✕</button>
                </div>
            </div>
            <iframe id="map-iframe" class="map-iframe" allowfullscreen loading="lazy"></iframe>
        </div>
    </div>

    <script>
        function openMapViewer(lat, lng) {
            const backdrop = document.getElementById('map-backdrop');
            const iframe = document.getElementById('map-iframe');
            const title = document.getElementById('map-title');
            const externalLink = document.getElementById('gmaps-external');

            title.textContent = `Coordinates: ${lat}, ${lng}`;
            iframe.src = `https://maps.google.com/maps?q=${lat},${lng}&z=16&output=embed`;
            externalLink.href = `https://www.google.com/maps?q=${lat},${lng}`;
            backdrop.style.display = 'flex';
        }

        function closeMapViewer() {
            const backdrop = document.getElementById('map-backdrop');
            const iframe = document.getElementById('map-iframe');
            backdrop.style.display = 'none';
            iframe.src = '';
        }

        fetch('/api/get_locations')
            .then(async res => {
                if (res.status === 401) {
                    window.location.href = '/';
                    throw new Error("Unauthorized");
                }
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || "Database error");
                }
                return data;
            })
            .then(data => {
                const tbody = document.getElementById('log-table');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No unique locations recorded yet.</td></tr>';
                    return;
                }
                data.forEach(row => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${row.id}</td>
                            <td>${row.latitude}</td>
                            <td>${row.longitude}</td>
                            <td>${row.timestamp}</td>
                            <td>
                                <button class="map-btn" onclick="openMapViewer(${row.latitude}, ${row.longitude})">
                                    📍 View on Maps
                                </button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('log-table').innerHTML = `<tr><td colspan="5" style="color:red;">Error: ${err.message}</td></tr>`;
            });
    </script>
</body>
</html>
