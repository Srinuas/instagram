<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reel App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Hidden Admin Trigger -->
        <div class="header" ondblclick="document.getElementById('admin-modal').style.display='block'">
            <span>&larr; Reels</span>
        </div>

	<video id="reelVideo" autoplay loop playsinline muted onclick="this.muted = !this.muted">
            <source src="reel.mp4" type="video/mp4">
        </video>
        
<div class="right-sidebar">
            <!-- Like (Red Heart) -->
            <div class="action-btn">
                <svg aria-label="Like" fill="#ff3040" height="28" role="img" viewBox="0 0 48 48" width="28">
                    <path d="M34.6 3.1c-4.5 0-7.9 1.8-10.6 5.6-2.7-3.7-6.1-5.5-10.6-5.5C6 3.1 0 9.6 0 17.6c0 7.3 5.4 12 10.6 16.5.6.5 1.3 1.1 1.9 1.7l2.3 2c4.4 3.9 6.6 5.9 7.6 6.5.5.3 1.1.5 1.6.5s1.1-.2 1.6-.5c1-.6 2.8-2.2 7.8-6.8l2-1.8c.7-.6 1.3-1.2 2-1.7C42.7 29.6 48 25 48 17.6c0-8-6-14.5-13.4-14.5z"></path>
                </svg>
                <span>1M</span>
            </div>

            <!-- Comment -->
            <div class="action-btn">
                <svg aria-label="Comment" fill="currentColor" height="26" role="img" viewBox="0 0 24 24" width="26">
                    <path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                <span>3,628</span>
            </div>

            <!-- Repost -->
            <div class="action-btn">
                <svg aria-label="Repost" fill="currentColor" height="26" role="img" viewBox="0 0 24 24" width="26">
                    <path d="M19.998 9.497a1 1 0 0 0-1 1v4.228a3.274 3.274 0 0 1-3.27 3.27h-5.313l1.791-1.787a1 1 0 0 0-1.412-1.416L7.29 18.287a1.004 1.004 0 0 0-.294.707v.001c0 .023.012.042.013.065a.923.923 0 0 0 .281.643l3.502 3.504a1 1 0 0 0 1.414-1.414l-1.797-1.798h5.318a5.276 5.276 0 0 0 5.27-5.27v-4.228a1 1 0 0 0-1-1Zm-6.41-3.496-1.795 1.795a1 1 0 1 0 1.414 1.414l3.5-3.5a1.003 1.003 0 0 0 0-1.417l-3.5-3.5a1 1 0 0 0-1.414 1.414l1.794 1.794H8.27A5.277 5.277 0 0 0 3 9.271V13.5a1 1 0 0 0 2 0V9.271a3.275 3.275 0 0 1 3.271-3.27Z"></path>
                </svg>
                <span>4,739</span>
            </div>

            <!-- Share -->
            <div class="action-btn">
                <svg aria-label="Share" fill="currentColor" height="26" role="img" viewBox="0 0 24 24" width="26">
                    <path d="M13.973 20.046 21.77 6.928C22.8 5.195 21.55 3 19.535 3H4.466C2.138 3 .984 5.825 2.646 7.456l4.842 4.752 1.723 7.121c.548 2.266 3.571 2.721 4.762.717Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2"></path>
                    <line fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="7.488" x2="15.515" y1="12.208" y2="7.641"></line>
                </svg>
                <span>110K</span>
            </div>

            <!-- Save -->
            <div class="action-btn">
                <svg aria-label="Save" fill="currentColor" height="26" role="img" viewBox="0 0 24 24" width="26">
                    <polygon fill="none" points="20 21 12 13.44 4 21 4 3 20 3 20 21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></polygon>
                </svg>
                <span>40.5K</span>
            </div>
        </div>

        <div class="bottom-info">
            <div class="floating-avatars">
                <img src="float_img1.jpg" class="float-img">
                <img src="float_img2.jpg" class="float-img">
                <img src="float_img3.jpg" class="float-img">
            </div>
            <div class="user-row">
                <img src="profile_img1.jpg" class="profile-img">
                <span class="username">ab_comedy_182</span>
                <button class="follow-btn">Follow</button>
            </div>
            <div class="caption">Watch till end 😂</div>
            <div class="hashtags">#comedy #funny #reels #laugh #explorepage</div>
        </div>

        <!-- Hidden Admin Login Modal -->
        <div id="admin-modal" class="modal" style="display:none;">
            <h3>Admin Login</h3>
            <input type="password" id="pin-input" placeholder="Enter PIN">
            <button onclick="attemptLogin()">Submit</button>
            <button onclick="document.getElementById('admin-modal').style.display='none'">Close</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
